    <path d="M118 270 C150 252 180 262 206 254 C236 246 262 262 296 252 C330 244 370 258 404 250 L404 300 L118 300 Z" fill="url(#far)"/>
    <path d="M118 290 C160 276 210 286 256 280 C300 274 350 284 404 278 L404 360 L118 360 Z" fill="url(#hill)"/>
    <!-- river -->
    <path d="M250 282 C246 300 230 312 232 336 L222 360 L292 360 C284 336 268 318 270 300 C271 292 266 284 258 281 Z" fill="url(#water)"/>
    <path d="M254 296 C250 308 244 318 246 332 M262 300 C262 314 270 326 272 340" stroke="#fff" stroke-opacity=".6" stroke-width="2" fill="none"/>
    <!-- forests: back to front -->
    <use href="#fir" x="140" y="236" width="24" height="60" opacity=".7"/><use href="#fir" x="300" y="234" width="24" height="60" opacity=".7"/><use href="#fir" x="352" y="238" width="22" height="56" opacity=".7"/>
    <use href="#fir" x="128" y="236" width="36" height="90"/><use href="#fir" x="158" y="222" width="40" height="100"/><use href="#fir" x="190" y="248" width="30" height="76"/>
    <use href="#fir" x="300" y="246" width="32" height="80"/><use href="#fir" x="326" y="220" width="42" height="104"/><use href="#fir" x="362" y="240" width="34" height="86"/>
    <circle cx="256" cy="222" r="118" fill="url(#vign)"/>
  </g>
  <circle cx="256" cy="222" r="118" fill="none" stroke="#0a2a66" stroke-width="5"/>
  <!-- flag on the summit -->
  <line x1="263" y1="146" x2="263" y2="104" stroke="#e8e8e8" stroke-width="5" stroke-linecap="round"/>
  <path d="M266 106 C276 103 284 111 298 108 C292 114 292 120 298 126 C284 129 276 121 266 124 Z" fill="#e53935" stroke="#8c1d18" stroke-width="2"/>
  <!-- crown -->
  <g filter="url(#shadow)">
