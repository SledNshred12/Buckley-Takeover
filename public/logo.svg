<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b9bff"/><stop offset=".5" stop-color="#1a5fd0"/><stop offset="1" stop-color="#082e75"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".35" stop-color="#ffd23f"/><stop offset=".7" stop-color="#e09a00"/><stop offset="1" stop-color="#a86a00"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b6fc4"/><stop offset=".45" stop-color="#9cc3f0"/><stop offset=".75" stop-color="#f6d6b0"/><stop offset="1" stop-color="#f3b68a"/></linearGradient>
    <linearGradient id="rockL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d9bb3"/><stop offset="1" stop-color="#b9c4d6"/></linearGradient>
    <linearGradient id="rockR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5d6b85"/><stop offset="1" stop-color="#3f4b63"/></linearGradient>
    <linearGradient id="snowR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfe8f5"/><stop offset="1" stop-color="#aebdd6"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8a4a"/><stop offset="1" stop-color="#2b5a2b"/></linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f8fa0"/><stop offset="1" stop-color="#3f6f70"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9ff"/><stop offset="1" stop-color="#2f8fd6"/></linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6b35"/><stop offset=".5" stop-color="#1d4a24"/><stop offset="1" stop-color="#123318"/></linearGradient>
    <radialGradient id="haze" cx=".5" cy=".75" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="vign" cx=".5" cy=".45" r=".55"><stop offset=".75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
    <clipPath id="inner"><circle cx="256" cy="222" r="118"/></clipPath>
    <symbol id="fir" viewBox="0 0 40 100"><rect x="18" y="86" width="4" height="14" fill="#3e2a1a"/><path d="M20 0 L28 22 L24 22 L33 44 L27 44 L37 68 L30 68 L40 90 L0 90 L10 68 L3 68 L13 44 L7 44 L16 22 L12 22 Z" fill="url(#tree)"/></symbol>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M256 486 C196 400 98 332 98 222 A158 158 0 1 1 414 222 C414 332 316 400 256 486 Z" fill="url(#pin)" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <path d="M140 150 A140 140 0 0 1 330 90" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>
  <g clip-path="url(#inner)">
    <rect x="130" y="100" width="260" height="250" fill="url(#sky)"/>
    <g fill="#fff" opacity=".75"><ellipse cx="180" cy="140" rx="30" ry="7"/><ellipse cx="205" cy="134" rx="20" ry="6"/><ellipse cx="335" cy="150" rx="26" ry="6"/></g>
    <!-- mountain -->
    <path d="M118 286 L196 214 L232 172 L252 150 L262 144 L274 154 L296 178 L330 214 L404 286 Z" fill="url(#rockL)"/>
    <path d="M262 144 L274 154 L296 178 L330 214 L404 286 L268 286 L276 240 L262 200 Z" fill="url(#rockR)"/>
    <path d="M196 214 L232 172 L252 150 L262 144 L274 154 L296 178 L318 202 L306 206 L298 196 L286 212 L276 200 L266 222 L258 204 L246 220 L236 206 L224 222 L214 210 Z" fill="#fbfdff"/>
    <path d="M262 144 L274 154 L296 178 L318 202 L306 206 L298 196 L286 212 L276 200 L266 222 L262 200 Z" fill="url(#snowR)"/>
    <path d="M244 172 L236 196 M282 172 L292 192 M256 160 L252 182" stroke="#9fb0c8" stroke-width="2" fill="none"/>
    <rect x="120" y="230" width="280" height="70" fill="url(#haze)"/>
