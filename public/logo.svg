    <rect x="174" y="72" width="164" height="16" rx="4" fill="url(#gold)" stroke="#6b4300" stroke-width="5"/>
    <path d="M196 40 L212 60 M300 60 L316 40" stroke="#fff8d0" stroke-width="3" opacity=".7"/>
    <circle cx="256" cy="10" r="10" fill="#e53935" stroke="#6b4300" stroke-width="4"/><circle cx="253" cy="7" r="3" fill="#fff" opacity=".8"/>
    <circle cx="162" cy="26" r="8" fill="#fff" stroke="#6b4300" stroke-width="4"/><circle cx="350" cy="26" r="8" fill="#fff" stroke="#6b4300" stroke-width="4"/>
    <circle cx="256" cy="80" r="6" fill="#1e88e5" stroke="#6b4300" stroke-width="3"/><circle cx="214" cy="80" r="5" fill="#43a047" stroke="#6b4300" stroke-width="3"/><circle cx="298" cy="80" r="5" fill="#43a047" stroke="#6b4300" stroke-width="3"/>
  </g>
</svg>
